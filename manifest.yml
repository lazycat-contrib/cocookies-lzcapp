application:
  subdomain: cocookies
  background_task: true

  upstreams:
    - location: /
      backend: http://frontend:80/

services:
  backend:
    # ghcr.io/mariinkys/cocookies-backend:0.2.0
    image: ghcr.io/mariinkys/cocookies-backend:0.2.0
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:sqlite:/app/data/cocookies.db
      - JWT_SECRET={{ stable_secret "jwt_secret" }}
      - CORS_ALLOWED_ORIGIN=https://{{ .S.AppDomain }}
      - COOKIE_SECURE=true
      - TRUST_PROXY=true
    binds:
      - /lzcapp/var/data:/app/data

  frontend:
    # ghcr.io/mariinkys/cocookies-frontend:0.2.1
    image: ghcr.io/mariinkys/cocookies-frontend:0.2.1
    depends_on:
      - backend
