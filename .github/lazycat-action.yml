version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: frontend

build:
  run_buildscript: false

images:
  - id: backend
    target: service
    service: backend
    source: ghcr.io/mariinkys/cocookies-backend
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

  - id: frontend
    target: service
    service: frontend
    source: ghcr.io/mariinkys/cocookies-frontend
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: Cocookies
      source: https://github.com/mariinkys/cocookies
      source_author: mariinkys
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cocookies
    summary: 由 GitHub Actions 自动发布
